<section class="section">
  <div class="container-custom max-w-4xl">

    <div class="mb-8">
      <span class="block font-mono text-accent/70 text-sm tracking-widest uppercase">Steam</span>
      <h1 class="section-title mt-3">Steam — Iron Raptor</h1>
      <p class="text-text-secondary mt-4">Imported Steam group information and events.</p>
    </div>

    <div class="card prose max-w-none">
      <div [innerHTML]="content"></div>
    </div>

    <div class="mt-8 pt-8 border-t border-soft">
      <a routerLink="/games" class="btn btn-ghost">Back to games</a>
    </div>
  </div>
</section>
