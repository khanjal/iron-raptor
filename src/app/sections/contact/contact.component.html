<section id="contact" class="section-alt">
  <div class="container-custom max-w-3xl text-center">
    <span class="eyebrow">Community</span>
    <h2 class="section-title mt-3">{{ config.contact.heading }}</h2>
    <p class="text-secondary mt-6 mb-8">{{ config.contact.subheading }}</p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      @if (config.social.discord) {
        <a [href]="config.social.discord" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Join our Discord</a>
      }
      @if (config.social.steam) {
        <a [href]="config.social.steam" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">Steam group</a>
      }
    </div>
  </div>
</section>
